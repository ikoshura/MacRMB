name: MacRMB
options:
  bundleIdPrefix: dev.abrar
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.7.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Abrar Zharifan Syah (JSYLVAZ935)"
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.1.1
  release:
    # Notarization requirements: no get-task-allow injection, secure timestamp.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: --timestamp
targets:
  RMBCore:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/RMB
        excludes:
          - "macos/macos_appkit_impl.mm"
      - path: Vendor/RMB/macos/macos_appkit_impl.mm
        compilerFlags: "-fno-objc-arc"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.RMBCore
        GENERATE_INFOPLIST_FILE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Vendor/RMB"
          - "Vendor/RMB/Utils"
          - "Vendor/RMB/macos"
  MacRMBKit:
    type: framework
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.MacRMBKit
        GENERATE_INFOPLIST_FILE: YES
  MacRMB:
    type: application
    platform: macOS
    # Xcode's generated Info.plist only honors whitelisted INFOPLIST_KEY_*
    # entries — custom keys (SUFeedURL/SUPublicEDKey) need an explicit plist,
    # which xcodegen generates with the standard boilerplate merged in.
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MacRMB
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: "https://github.com/ikoshura/MacRMB/releases/latest/download/appcast.xml"
        SUPublicEDKey: "+jvAD296kzdwj7OZyXHd9M12SYmnOaBcrrXQB+Hg3ec="
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    sources:
      - Sources/App
      - Sources/Views
      - Sources/Assets.xcassets
    dependencies:
      - target: MacRMBKit
      - target: RMBCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.MacRMB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/App/MacRMB-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Vendor/RMB"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
  MacRMBKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacRMBKitTests
    dependencies:
      - target: MacRMBKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.MacRMBKitTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacRMB:
    build:
      targets:
        MacRMB: all
        MacRMBKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacRMBKitTests
