name: MacRMB
options:
  bundleIdPrefix: dev.abrar
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.7.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Abrar Zharifan Syah (JSYLVAZ935)"
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.1.0
targets:
  RMBCore:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/RMB
        excludes:
          - "macos/macos_appkit_impl.mm"
      - path: Vendor/RMB/macos/macos_appkit_impl.mm
        compilerFlags: "-fno-objc-arc"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.RMBCore
        GENERATE_INFOPLIST_FILE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Vendor/RMB"
          - "Vendor/RMB/Utils"
          - "Vendor/RMB/macos"
  MacRMBKit:
    type: framework
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.MacRMBKit
        GENERATE_INFOPLIST_FILE: YES
  MacRMB:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Views
    dependencies:
      - target: MacRMBKit
      - target: RMBCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.MacRMB
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacRMB
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_SUPublicEDKey: "+jvAD296kzdwj7OZyXHd9M12SYmnOaBcrrXQB+Hg3ec="
        INFOPLIST_KEY_SUFeedURL: "https://example.com/macrmb/appcast.xml"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/App/MacRMB-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Vendor/RMB"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
  MacRMBKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacRMBKitTests
    dependencies:
      - target: MacRMBKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrar.MacRMBKitTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacRMB:
    build:
      targets:
        MacRMB: all
        MacRMBKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacRMBKitTests
